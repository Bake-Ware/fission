[package]
name = "fission-app"
edition.workspace = true
version.workspace = true

[dependencies]
fission-kernel = { path = "../fission-kernel" }
fission-model = { path = "../fission-model" }
fission-f3d = { path = "../fission-f3d" }
fission-occt = { path = "../fission-occt" }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui-wgpu = "0.36"
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.17"
log = "0.4"
env_logger = "0.11"
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
pollster = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
