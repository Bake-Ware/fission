<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.55" stop-color="#101a3d"/>
      <stop offset="1" stop-color="#1b0d33"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee7ff"/>
      <stop offset="0.5" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#ff5ecd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ee7ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5ee7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a3b7a" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <circle cx="1030" cy="200" r="190" fill="url(#glow)"/>

  <!-- an isometric cube splitting apart: fission -->
  <g transform="translate(1030 205)" stroke-linejoin="round">
    <g transform="translate(-34 -18)">
      <path d="M0 -110 L-95 -55 L-95 55 L0 0 Z" fill="#1d6cff" fill-opacity="0.55" stroke="#5ee7ff" stroke-width="2"/>
      <path d="M0 -110 L95 -55 L0 0 Z" fill="#5ee7ff" fill-opacity="0.35" stroke="#5ee7ff" stroke-width="2"/>
    </g>
    <g transform="translate(34 18)">
      <path d="M0 0 L95 -55 L95 55 L0 110 Z" fill="#a24bff" fill-opacity="0.55" stroke="#ff5ecd" stroke-width="2"/>
      <path d="M0 0 L-95 55 L0 110 Z" fill="#ff5ecd" fill-opacity="0.3" stroke="#ff5ecd" stroke-width="2"/>
    </g>
    <line x1="-150" y1="-90" x2="150" y2="90" stroke="#ffffff" stroke-width="3" opacity="0.9" filter="url(#soft)"/>
    <line x1="-150" y1="-90" x2="150" y2="90" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="6" fill="#fff"/>
  </g>

  <text x="80" y="185" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="10" fill="url(#title)">FISSION</text>
  <text x="84" y="240" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#dfe6ff">Parametric CAD, reimagined for the agentic age.</text>
  <text x="84" y="282" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#93a0d6">A clean-room, Fusion 360-style modeler in Rust · opens .f3d · scriptable by agents</text>
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#5ee7ff">
    <rect x="84" y="312" width="430" height="38" rx="8" fill="#0b1230" stroke="#2a3b7a"/>
    <text x="100" y="337">$ fission-app export part.f3d part.stl</text>
  </g>
</svg>
